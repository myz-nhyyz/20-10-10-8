<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sự thức giấc của Tiny - Chúc Mừng 20/10 Lớp 10A8 💖</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #040408;
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      cursor: pointer;
    }

    /* Nền lưới caro chìm giống video */
    .cyber-grid-bg {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .font-typewriter {
      font-family: 'Courier Prime', monospace;
      letter-spacing: 0.08em;
    }

    /* Hiệu ứng chữ phát sáng */
    .glow-white-cyan {
      color: #f8fafc;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.95),
        0 0 18px rgba(103, 232, 249, 0.8),
        0 0 36px rgba(6, 182, 212, 0.5);
    }

    .glow-pink {
      color: #ffd6e8;
      text-shadow:
        0 0 8px rgba(255, 194, 222, 0.95),
        0 0 18px rgba(244, 114, 182, 0.85),
        0 0 32px rgba(236, 72, 153, 0.55);
    }

    .glow-warm-gold {
      color: #fff7ed;
      text-shadow:
        0 0 8px rgba(255, 247, 237, 0.95),
        0 0 18px rgba(253, 186, 116, 0.85),
        0 0 32px rgba(251, 146, 60, 0.55);
    }

    .glow-green {
      color: #86efac;
      text-shadow:
        0 0 10px rgba(134, 239, 172, 0.95),
        0 0 22px rgba(34, 197, 94, 0.85),
        0 0 38px rgba(22, 163, 74, 0.65);
    }

    /* ================= ĐÔI MẮT ROBOT TINY NEON CYAN ================= */
    .eyes-wrapper {
      position: fixed;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 54px;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 25;
      pointer-events: none;
    }

    .eye-unit {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cyber-eye {
      width: 118px;
      height: 114px;
      background: radial-gradient(circle at 50% 45%, #80fbff 0%, #00f0ff 60%, #00d0ff 100%);
      border-radius: 26px;
      box-shadow:
        0 0 24px #00f0ff,
        0 0 50px rgba(0, 240, 255, 0.78),
        0 0 90px rgba(0, 240, 255, 0.42),
        inset 0 0 18px rgba(255, 255, 255, 0.78);
      transition: all 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    /* 4 vệt má hồng //// dưới mắt */
    .eye-blush {
      margin-top: 12px;
      display: flex;
      gap: 7px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .show-blush .eye-blush {
      opacity: 0.92;
    }
    .eye-blush span {
      display: block;
      width: 2.2px;
      height: 15px;
      background: #ff6ea7;
      border-radius: 2px;
      transform: rotate(22deg);
      box-shadow: 0 0 8px #ff6ea7;
    }

    /* Khi người dùng click liên tục lúc đang đợi Intro (00:17 trong video) */
    .eyes-wait-squint .cyber-eye {
      height: 28px !important;
      border-radius: 999px !important;
    }

    /* Hơi nheo mắt khen đẹp */
    .eyes-squint .cyber-eye {
      height: 82px;
      border-radius: 22px;
    }

    /* Cảnh Áo dài */
    .eyes-aodai {
      left: 52%;
      top: 49%;
      gap: 76px;
    }

    /* Mắt cong cười ︶ ︶ (Cảnh Viên pha lê 00:19) */
    .eyes-happy-arc {
      top: 42%;
    }
    .eyes-happy-arc .cyber-eye {
      width: 98px;
      height: 22px;
      border-radius: 0 0 60px 60px;
      background: #00f0ff;
      transform: translateY(10px) rotate(-4deg);
    }
    .eyes-happy-arc .eye-unit:last-child .cyber-eye {
      transform: translateY(10px) rotate(4deg);
    }

    /* Cảnh Sức khỏe (00:22): Mắt trái nháy cong nhỏ, mắt phải vuông to */
    .eyes-health {
      left: 43%;
      top: 50%;
      gap: 64px;
    }
    .eyes-health .eye-unit:first-child .cyber-eye {
      width: 56px;
      height: 22px;
      background: transparent;
      border-bottom: 9px solid #5efcff;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-radius: 0 0 50px 50px;
      box-shadow: 0 8px 18px rgba(0, 240, 255, 0.75);
      transform: translateY(6px);
    }
    .eyes-health .eye-unit:last-child .cyber-eye {
      width: 132px;
      height: 132px;
      border-radius: 28px;
    }

    /* Cảnh Nụ cười & Đĩa nhạc (00:28) */
    .eyes-smile-scene {
      left: 34%;
      top: 49%;
      gap: 48px;
      transform: translate(-50%, -50%) scale(0.86);
    }

    /* Mắt > < khi chuẩn bị tặng cỏ 4 lá (00:30 - 00:31) */
    .eyes-gt-lt .eye-unit:first-child .cyber-eye {
      width: 56px;
      height: 56px;
      background: transparent !important;
      box-shadow: none !important;
      border-top: 9px solid #38f9ff;
      border-right: 9px solid #38f9ff;
      border-radius: 0 8px 0 0;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 22px #00f0ff);
    }
    .eyes-gt-lt .eye-unit:last-child .cyber-eye {
      width: 56px;
      height: 56px;
      background: transparent !important;
      box-shadow: none !important;
      border-bottom: 9px solid #38f9ff;
      border-left: 9px solid #38f9ff;
      border-radius: 0 0 0 8px;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 22px #00f0ff);
    }

    /* Mắt > ■ khi nói "nè cầm lấy đi" (00:32 - 00:33) */
    .eyes-gt-square .eye-unit:first-child .cyber-eye {
      width: 56px;
      height: 56px;
      background: transparent !important;
      box-shadow: none !important;
      border-top: 9px solid #38f9ff;
      border-right: 9px solid #38f9ff;
      border-radius: 0 8px 0 0;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 22px #00f0ff);
    }

    /* Cảnh Máy bay chia sẻ (00:40) */
    .eyes-share-scene {
      left: 50%;
      top: 41%;
      gap: 42px;
      transform: translate(-50%, -50%) scale(0.74);
    }
    /* Mắt nghiêng nhìn xuống bình nhiên liệu (00:42) */
    .eyes-look-fuel {
      left: 48%;
      top: 41%;
      gap: 42px;
      transform: translate(-50%, -50%) scale(0.74) rotate(-8deg);
    }

    /* Mắt cười ^ ^ khi cảm ơn (00:45 - 00:53) */
    .eyes-chevron-happy {
      left: 50%;
      top: 41%;
      gap: 58px;
      transform: translate(-50%, -50%) scale(0.84);
    }
    .eyes-chevron-happy .cyber-eye {
      width: 58px;
      height: 58px;
      background: transparent !important;
      box-shadow: none !important;
      border-top: 9px solid #38f9ff;
      border-left: 9px solid #38f9ff;
      border-radius: 8px 0 0 0;
      transform: rotate(45deg) translate(10px, 10px);
      filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 24px #00f0ff);
    }

    /* Chớp mắt thành vệt ngang (00:24 & 00:27) */
    .eye-blink .cyber-eye {
      height: 7px !important;
      border-radius: 999px !important;
    }

    /* ================= TỐI ƯU TRÊN ĐIỆN THOẠI ================= */
    @media (max-width: 640px) {
      .cyber-eye {
        width: 78px;
        height: 76px;
        border-radius: 18px;
      }
      .eyes-wrapper {
        gap: 28px;
        top: 43%;
      }
      .eye-blush {
        margin-top: 8px;
        gap: 5px;
      }
      .eye-blush span {
        height: 11px;
      }
      .eyes-aodai {
        left: 36%;
        top: 42%;
        gap: 26px;
        transform: translate(-50%, -50%) scale(0.82);
      }
      .eyes-health {
        left: 38%;
        top: 36%;
        gap: 28px;
        transform: translate(-50%, -50%) scale(0.78);
      }
      .eyes-smile-scene {
        left: 34%;
        top: 27%;
        gap: 24px;
        transform: translate(-50%, -50%) scale(0.74);
      }
      .eyes-share-scene, .eyes-look-fuel {
        top: 36%;
        gap: 28px;
        transform: translate(-50%, -50%) scale(0.7);
      }
      .eyes-chevron-happy {
        top: 34%;
        gap: 38px;
        transform: translate(-50%, -50%) scale(0.7);
      }
    }

    /* ================= VIÊN PHA LÊ XANH + 2 VÒNG QUỸ ĐẠO (00:20) ================= */
    .diamond-btn-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .orbit-ring-1 {
      position: absolute;
      width: 135px;
      height: 44px;
      border: 1.2px solid rgba(186, 230, 253, 0.55);
      border-radius: 50%;
      transform: rotate(-28deg);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .orbit-ring-2 {
      position: absolute;
      width: 155px;
      height: 52px;
      border: 1px solid rgba(186, 230, 253, 0.35);
      border-radius: 50%;
      transform: rotate(32deg);
      pointer-events: none;
    }
    .diamond-outer {
      width: 58px;
      height: 58px;
      border-radius: 13px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.45), rgba(30, 64, 175, 0.78));
      border: 2px solid #7dd3fc;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.9),
        0 0 55px rgba(56, 189, 248, 0.5),
        inset 0 0 15px rgba(186, 230, 253, 0.65);
      animation: diamondPulse 2s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0%, 100% { filter: brightness(1); transform: rotate(45deg) scale(1); }
      50% { filter: brightness(1.25); transform: rotate(45deg) scale(1.09); }
    }

    /* ================= ĐĨA THAN VINYL XOAY (00:28) ================= */
    .vinyl-disc {
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #f9a8d4 0 21%, #141218 22% 33%, #27242d 34% 35%, #141218 36% 47%, #27242d 48% 49%, #141218 50% 62%, #27242d 63% 64%, #110f14 65% 100%);
      border: 2px solid rgba(244, 114, 182, 0.45);
      box-shadow: 0 0 28px rgba(244, 114, 182, 0.28);
      animation: spinVinyl 6s linear infinite;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .vinyl-disc { width: 124px; height: 124px; }
    }
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ================= BÌNH NHIÊN LIỆU & MÁY BAY (00:40 - 00:48) ================= */
    .fuel-tank {
      position: relative;
      width: 148px;
      height: 132px;
      border-radius: 22px;
      border: 2px solid rgba(125, 211, 252, 0.78);
      background: rgba(15, 23, 42, 0.75);
      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.25),
        inset 0 0 18px rgba(125, 211, 252, 0.18);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .fuel-tank:hover {
      transform: scale(1.03);
      box-shadow: 0 0 32px rgba(251, 146, 60, 0.45);
    }
    .fuel-tank:active {
      transform: scale(0.97);
    }

    .fuel-liquid {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      height: 78%;
      border-radius: 15px;
      background: linear-gradient(180deg, #fef9c3 0%, #fdba74 38%, #fb923c 72%, #f472b6 100%);
      box-shadow: 0 0 20px rgba(251, 146, 60, 0.55);
      transition: height 0.15s linear;
    }

    @media (max-width: 640px) {
      .fuel-tank {
        width: 118px;
        height: 106px;
        border-radius: 18px;
      }
    }

    .fuel-flow-dash {
      stroke-dasharray: 12 14;
      animation: flowDash 0.42s linear infinite;
    }
    @keyframes flowDash {
      from { stroke-dashoffset: 26; }
      to { stroke-dashoffset: 0; }
    }

    .plane-takeoff {
      animation: planeFlyAway 2.2s cubic-bezier(0.3, 0, 0.6, 1) forwards;
    }
    @keyframes planeFlyAway {
      0% { transform: translate(0, 0) rotate(0deg); }
      30% { transform: translate(35px, -8px) rotate(-8deg); }
      100% { transform: translate(480px, -210px) rotate(-18deg) scale(0.85); opacity: 0; }
    }

    .propeller-fast {
      animation: propSpin 0.12s linear infinite;
      transform-origin: 213px 68px;
    }
    @keyframes propSpin {
      from { transform: scaleY(1); }
      50% { transform: scaleY(0.15); }
      to { transform: scaleY(1); }
    }
  </style>
</head>
